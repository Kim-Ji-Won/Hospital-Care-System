spring.application.name=backend

# DB 아이디·비밀번호는 커밋하지 않고 환경변수(DB_USERNAME, DB_PASSWORD)로 넣는다
spring.datasource.url=jdbc:mysql://localhost:3306/hospital?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 팀 SQL 파일이 기준. JPA가 테이블을 만들거나 바꾸지 않게 함
spring.jpa.hibernate.ddl-auto=none
